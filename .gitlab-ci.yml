variables: 
  PHPFPM_REGISTRY_NAME: "835590170478.dkr.ecr.us-east-1.amazonaws.com/book-catalog/php-fpm"
  HTTPD_REGISTRY_NAME: "835590170478.dkr.ecr.us-east-1.amazonaws.com/book-catalog/httpd"

stages:
  - build-and-push
  - beploy

#To ensure pipeline triggers only when changes to the main branch
workflow:
    rules:
      - if: $CI_COMMIT_BRANCH == "main"
        when: always
      - when: never    

Bump-version:
    stage: build-and-push
    image: bash:latest
    script: 
        - VERSION=$(cat VERSION)
        - IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
        - PATCH=$((PATCH + 1))
        - NEW_VERSION="$MAJOR.$MINOR.$PATCH"
        - echo "current version:- $VERSION"
        - echo "New version:- $NEW_VERSION"
        - echo "NEW_VERSION=$NEW_VERSION" >> build.env
    artifacts:
        reports:
          dotenv: build.env

Build-and-push:
    stage: build-and-push
    image: docker:27-cli
    services:
      - docker:27-dind

    needs:
      - job: Bump-version  
        artifacts: true

    variables:
      DOCKER_HOST: tcp://docker:2375
      DOCKER_TLS_CERTDIR: ""  

    before_script:
        - echo "Installing openssl utility..."
        - apk add --no-cache openssl  
        - echo "Installing AWS"
        - apk add --no-cache aws-cli
        - aws --version

    script:
        #httpd image need ssl certs for enabling https the following command will generate the ssl cert and key
        - echo "Generating TLS certificate for httpd..."
        - mkdir -p httpd/ssl  
        - openssl req -x509 -nodes -days 1 -newkey rsa:2048 -keyout httpd/ssl/server.key -out httpd/ssl/server.crt -subj "/CN=localhost"

        - echo "building the docker image for httpd..."
        - docker build -t httpdimage -f httpd/httpdDockerfile .

        - echo "building the docker image for phpfpm..."
        - docker build -t phpfpmimage -f app/phpfpmDockerfile app/


        - echo "tagging images..."
        - docker tag docker.io/httpdimage "$HTTPD_REGISTRY_NAME:httpd-$NEW_VERSION"
        - docker tag docker.io/phpfpmimage "$PHPFPM_REGISTRY_NAME:phpfpm-$NEW_VERSION"

        - echo "Running ecr login"
        - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 835590170478.dkr.ecr.us-east-1.amazonaws.com

        - echo "pushing httpd image to ECR"
        - docker push "$HTTPD_REGISTRY_NAME:httpd-$NEW_VERSION"
        - echo "pushing phpfpm image to ECR"
        - docker push "$PHPFPM_REGISTRY_NAME:phpfpm-$NEW_VERSION"


Update-version:
  stage: build-and-push
  image: bash:latest
  script:
    - echo "updating new version back to VERSION file"
    - bash ./scripts/Update-version.sh "$NEW_VERSION" VERSION