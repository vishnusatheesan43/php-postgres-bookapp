services:
  phpfpm-service:
    image: php-postgres-bookapp/phpfpm:latest
    build:
       context: app
       dockerfile: phpfpmDockerfile  
    restart: always
    environment:
      DB_HOST: psql-db
      DB_NAME: bookappdb
      DB_USER: bookapp_admin
      DB_PASS: example

    ports:
      - 9000:9000
    depends_on:
      - psql-db

  psql-db:
    image:  postgres:16-alpine
    environment:
      POSTGRES_USER: bookapp_admin
      POSTGRES_PASSWORD: example
      POSTGRES_DB: bookappdb

    volumes:
      - my-psqldb-vol2:/var/lib/postgresql/data

  httpd:
    image: php-postgres-bookapp/httpd:latest
    build:
      context: .
      dockerfile: httpd/httpdDockerfile
    environment:
      DB_HOST: psql-db
      DB_NAME: bookappdb
      DB_USER: bookapp_admin
      DB_PASS: example
    ports:
      - 80:80
      - 443:443
    restart: always
    depends_on:
      - phpfpm-service
volumes:
  my-psqldb-vol2:
