.deploy_template:
  image: alpine/k8s:1.34.11
  needs:
   - job: Build-and-push
     artifacts: true 
   - job: Update-version

  before_script:
    - Config_File="helm/config/${ENV}/${ENV}_values.yaml"
    - cluster=$(yq '.cluster' $Config_File) 
    - namespace=$(yq '.namespace' $Config_File) 
    - region=$(yq '.region' $Config_File)

  script:
    - echo "======================================"
    - echo "Environment   :- $ENV"  
    - echo "HTTPD TAG     :- $HTTPD_TAG"  
    - echo "PHPFPM TAG    :- $PHPFPM_TAG"
    - echo "Config File   :- $Config_File"
    - echo "======================================="
    
    - echo "Updating kubeconfig to authenticate eks cluster"
    - aws eks update-kubeconfig --region "$region" --name "$cluster"

    - echo "Deploying application to cluster"
    - helm upgrade --install bookcatlogqa helm/bookcatlog -f "$Config_File" --set httpdDeployment.tag="$HTTPD_TAG" --set phpfpmDeployment.tag="$PHPFPM_TAG"
    
    - echo "Updating the tags back to config file for track"
    - if [[ $? -eq 0 ]]; then 
      yq -i '.httpdDeployment.tag = env(HTTPD_TAG)' "$Config_File";
      yq -i '.phpfpmDeployment.tag = env(PHPFPM_TAG)' "$Config_File";
      fi
    - git config --global user.email "gitlab-ci@example.com"
    - git config --global user.name "GitLab CI Bot"
    - git remote set-url origin "https://oauth2:${GITLAB_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"  
    - git add "$Config_File"
    - git commit -m "updating the new image tag to $Config_File [skip ci]"
    - git push origin HEAD:main

