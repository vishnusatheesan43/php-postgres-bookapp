apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bookcatalog-qa-ingress
  namespace: {{ .Values.namespace }}
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/group.name: bookcatalog-shared-alb
    alb.ingress.kubernetes.io/group.order: "{{ .Values.ingress.order }}"  # Lower number evaluated first
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: "{{ .Values.ingress.path }}"
            pathType: Prefix
            backend:
              service:
                name: httpd-service
                port:
                  number: 80

