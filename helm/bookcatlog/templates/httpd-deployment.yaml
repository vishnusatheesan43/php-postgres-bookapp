apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: httpd-deploy
  name: httpd-deploy
  namespace: {{ .Release.Namespace }} 
spec:
  replicas: {{ .Values.httpdDeployment.replicas }}
  selector:
    matchLabels:
      app: httpd-deploy
  strategy: {}
  template:
    metadata:
      labels:
        app: httpd-deploy
    spec:
      containers:
      - image: "{{ .Values.httpdDeployment.repository }}:{{ .Values.httpdDeployment.tag }}"
        name: httpd
        ports:
          - containerPort: 80
        envFrom:
          - secretRef:
              name: app-secrets
        resources:
          requests: 
            memory: "500Mi"
            cpu: "100m"
          limits:
            memory: "600Mi"
            cpu: "150m"  
        livenessProbe:
          httpGet:
            path: /ping.html
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5 
          failureThreshold: 3
          successThreshold: 1

        readinessProbe:
          httpGet:
            path: /index.php
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5  
          failureThreshold: 3
          successThreshold: 1  
              
      # tolerations:
      #  - key: "node"
      #    operator: "Equal"
      #    value: "web"
      #    effect: "NoSchedule"
             
status: {}
