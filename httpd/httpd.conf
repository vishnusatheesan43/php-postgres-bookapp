LoadModule rewrite_module modules/mod_rewrite.so

DocumentRoot "/var/www/html"
DirectoryIndex index.php index.html

# ==========================================
# GLOBAL CONTEXT (Port 80 HTTP / Liveness Probe)
# ==========================================
<Directory "/var/www/html">
    AllowOverride All
    Require all granted

    RewriteEngine On

    #Donot rewrite static asset files 
    # RewriteRule ^assets/ - [L]

    # # 🛠️ FIXED: Skip all rewrites for health checks on Port 80
    # RewriteCond %{REQUEST_URI} ^/(ping\.html|index\.php)$
    # RewriteRule ^ - [L]

    # # 1. Handle root of a prefix with no trailing slash (e.g., /qa -> /qa/)
    # RewriteCond %{REQUEST_URI} ^/[^/]+$
    # RewriteRule ^([^/]+)$ /$1/ [R=301,L]

    # # 2. 🛠️ FIXED: Standardized to use relative context matching like the SSL block
    # RewriteRule ^[^/]+/(.*)$ $1 [L]
</Directory>

<FilesMatch \.php$>
    SetHandler "proxy:fcgi://phpfpm-service:9000"
</FilesMatch>

ProxyFCGIBackendType GENERIC

Listen 443

# ==========================================
# SSL VIRTUAL HOST CONTEXT (Port 443 HTTPS / User Traffic)
# ==========================================
<VirtualHost *:443>
    ServerName localhost

    SSLEngine on
    SSLCertificateFile "/usr/local/apache2/conf/custom_conf/server.crt"
    SSLCertificateKeyFile "/usr/local/apache2/conf/custom_conf/server.key"

    <Directory "/var/www/html">
        AllowOverride All
        Require all granted

        RewriteEngine On
        
        # 🛠️ FIXED: Skip all rewrites for health checks on Port 443
        RewriteCond %{REQUEST_URI} ^/(ping\.html|index\.php)$
        RewriteRule ^ - [L]
        
        # 1. Handle root of a prefix with no trailing slash (e.g., /qa -> /qa/)
        RewriteCond %{REQUEST_URI} ^/[^/]+$
        RewriteRule ^([^/]+)$ /$1/ [R=301,L]

        # 2. Strip prefix contextually
        RewriteRule ^[^/]+/(.*)$ $1 [L]
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:fcgi://phpfpm-service:9000"
    </FilesMatch>

    ProxyFCGIBackendType GENERIC
</VirtualHost>
