LoadModule rewrite_module modules/mod_rewrite.so

DocumentRoot "/var/www/html"

DirectoryIndex index.php index.html

<Directory "/var/www/html">
    AllowOverride All
    Require all granted

    RewriteEngine On

    # Handle root of a prefix with no trailing slash (e.g. /qa -> /qa/)
    RewriteCond %{REQUEST_URI} ^/[^/]+$
    RewriteRule ^/([^/]+)$ /$1/ [R=301,L]

    # Strip the first path segment (the env prefix) from everything else
    RewriteCond %{REQUEST_URI} ^/[^/]+/(.*)$
    RewriteRule ^ /%1 [L]
</Directory>

<FilesMatch \.php$>
    SetHandler "proxy:fcgi://phpfpm-service:9000"
</FilesMatch>

ProxyFCGIBackendType GENERIC

Listen 443

<VirtualHost *:443>
    ServerName localhost

    SSLEngine on
    SSLCertificateFile "/usr/local/apache2/conf/custom_conf/server.crt"
    SSLCertificateKeyFile "/usr/local/apache2/conf/custom_conf/server.key"

    <Directory "/var/www/html">
      AllowOverride All
      Require all granted

    RewriteEngine On

    # Handle root of a prefix with no trailing slash (e.g. /qa -> /qa/)
    RewriteCond %{REQUEST_URI} ^/[^/]+$
    RewriteRule ^([^/]+)$ /$1/ [R=301,L]

    # Strip the first path segment (the env prefix) from everything else
    RewriteCond %{REQUEST_URI} ^/[^/]+/(.*)$
    RewriteRule ^ /%1 [L]
    </Directory>

    <FilesMatch \.php$>
      SetHandler "proxy:fcgi://phpfpm-service:9000"
    </FilesMatch>

    ProxyFCGIBackendType GENERIC

</VirtualHost>